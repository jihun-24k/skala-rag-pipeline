[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skala-rag-pipeline"
version = "0.1.0"
description = "Evidence-traceable RAG pipeline for Physical AI investment review"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["financial_agent"]

[tool.pytest.ini_options]
testpaths = ["financial_agent/tests"]
addopts = "-q"
